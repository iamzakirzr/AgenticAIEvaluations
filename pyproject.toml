[project]
name = "agentic-ai-evaluations"
version = "0.1.0"
description = "A hands-on curriculum for building and evaluating RAG pipelines, chatbots and agents with LangChain, LangGraph, LangWatch, DeepEval and RAGAS."
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# WHY EVERY VERSION IS PINNED EXACTLY
# ---------------------------------------------------------------------------
# All five tools in this curriculum have made breaking API changes across minor
# versions. Code written against ragas 0.2 does not run on 0.4. Code written
# against langchain 0.3 does not run on 1.x. Most blog posts and tutorials you
# will find are written against the OLD versions and will not work.
#
# Exact pins mean: the lessons in this repo are guaranteed to run. When you
# later want to upgrade, change one pin at a time and run the test suite --
# that is itself a realistic exercise in maintaining an eval stack.
# ---------------------------------------------------------------------------
dependencies = [
    # --- LangChain 1.x: the orchestration layer (lesson 02) ---------------
    "langchain==1.4.0",
    "langchain-core==1.6.1",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.2",
    "langchain-ollama==1.1.0",       # ChatOllama + OllamaEmbeddings
    "langchain-openai==1.6.0",       # required transitively by ragas

    # --- LangGraph: stateful agent graphs (lesson 03) ---------------------
    "langgraph==1.2.11",

    # --- Evaluation libraries (lessons 04 and 05) ------------------------
    "deepeval==4.2.1",
    "ragas==0.4.3",

    # --- Observability (lesson 06). LangWatch is OpenTelemetry-based, ----
    # which is why we can unit-test our instrumentation offline.
    "langwatch==1.3.1",

    # --- Serving ----------------------------------------------------------
    # NOTE: there is no vector-database dependency here on purpose. LangChain
    # ships InMemoryVectorStore in langchain-core, and it does brute-force
    # EXACT search -- which core/corpus/vector_stores.md explains is the
    # correct default below ~100k chunks, not a shortcut. Adding Chroma or
    # FAISS here would buy persistence and approximate search, and cost an
    # entire class of recall bugs. 02_langchain/README.md shows how to swap
    # one in when you actually need it.
    "fastapi",
    "uvicorn",

    # --- Plumbing ---------------------------------------------------------
    "numpy",
    "httpx",
    "openai",        # used as the OpenAI-compatible client pointed at Ollama
    "rich",          # pretty score tables in the lessons
    "python-dotenv",
]

[project.optional-dependencies]
# Local embedding model that runs without Ollama. Pulls in torch (~1GB), so it
# is deliberately optional -- lesson 01 works without it.
local-embeddings = ["sentence-transformers"]

dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
# ---------------------------------------------------------------------------
# TEST MARKERS -- this is the two-tier strategy that makes the repo usable.
# ---------------------------------------------------------------------------
#   (unmarked)  Fast, deterministic, no model required. Runs in CI on every
#               push. This is where retrieval metrics and all pure-logic tests
#               live.
#   judge       Needs a live Ollama server AND calls an LLM to score. Slow,
#               non-deterministic, costs you GPU time. Skipped by default.
#   ollama      Needs a live Ollama server but does not use an LLM judge
#               (e.g. real embeddings, real generation). Skipped by default.
#   saas        Needs a third-party account + API key (LangWatch). Skipped
#               by default.
#
# Run fast tests:      pytest
# Run judged tests:    pytest -m judge
# Run everything:      pytest -m "judge or ollama or saas or not judge"
# ---------------------------------------------------------------------------
markers = [
    "judge: requires a live LLM acting as a judge (slow, non-deterministic)",
    "ollama: requires a running Ollama server at OLLAMA_BASE_URL",
    "saas: requires a third-party SaaS account and API key",
]
addopts = "-m 'not judge and not ollama and not saas' --strict-markers -q"
testpaths = ["core", "01_embeddings", "02_langchain", "03_langgraph", "04_deepeval", "05_ragas", "06_langwatch"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402"]  # lesson files import after the compat shim on purpose
