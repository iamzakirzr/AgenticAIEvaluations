[project]
name = "evalkit"
version = "0.1.0"
description = "A DeepEval-based test automation framework for LLM apps and AI agents: RAG quality, agent tool use, multi-turn chat, safety and red teaming."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }

# Exact pins for the eval libraries. DeepEval and DeepTeam change metric
# signatures between minor versions, and an eval suite that silently changes
# behaviour on `pip install` is not a test suite. Upgrade one pin at a time and
# run `make test` -- tests/unit/test_deepeval_contract.py exists to fail loudly
# when an upgrade breaks an API this framework relies on.
dependencies = [
    "deepeval==4.2.8",
    "deepteam==1.0.9",
    # deepteam 1.0.9 imports sentry_sdk at module load but does not declare it.
    "sentry-sdk>=2,<3",
    # Client libraries deepeval loads lazily for each judge provider.
    "ollama>=0.6,<1",
    "openai>=1.40",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evalkit = ["sut/rag_app/corpus/*.md"]

[tool.pytest.ini_options]
# Three tiers, selected by marker:
#   (unmarked)  unit tier: no model, no network. The default run and the PR gate.
#   llm         DeepEval metrics scored by a live judge LLM. Nightly.
#   redteam     DeepTeam adversarial attacks. Slowest; weekly or on demand.
markers = [
    "llm: scored by a live judge LLM (slow, non-deterministic, needs a provider)",
    "redteam: DeepTeam adversarial run (slowest, needs a provider)",
]
addopts = "-m 'not llm and not redteam' --strict-markers -q -p no:cacheprovider"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]
