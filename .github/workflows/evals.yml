# =============================================================================
# WORKFLOW 1 of 4 -- THE PULL REQUEST GATE
# =============================================================================
# Runs ONLY tests that need no model: deterministic, free, ~15 seconds.
#
# Why this is the only thing gating a PR: judged metrics are slow, cost GPU
# time, and vary between identical runs. Gate a pull request on one and the
# build goes red on sampling noise, someone adds `continue-on-error: true`, and
# within a fortnight nobody reads CI at all.
#
# The fast tier is not a smoke test. With no model it covers retrieval quality,
# chunking, dataset integrity, prompt structure, citation validation, agent
# trajectories, loop detection, PII redaction, index-version drift, budgets,
# the regression-gate maths and span instrumentation. 329 tests.
# =============================================================================

name: evals (PR gate)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # needed to post the metrics comment

concurrency:
  # Cancel superseded runs on the same branch. Without this a busy PR queues
  # five runs of a suite whose only purpose is fast feedback.
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tier:
    name: Fast tier (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # Exact pins from pyproject.toml. Every library in this stack has made
        # breaking changes across minor versions, so an unpinned install would
        # produce failures unrelated to the pull request. The `drift` workflow
        # deliberately tests the unpinned case instead.
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Fast tier
        env:
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
          DEEPEVAL_UPDATE_WARNING_OPT_OUT: "YES"
        run: .venv/bin/python -m pytest -q --junitxml=.artifacts/junit.xml

      - name: Retrieval quality report
        # Prints the chunk-size sweep so a reviewer can see the effect of a
        # retrieval change in the checks output, not just pass/fail.
        run: |
          mkdir -p .artifacts
          .venv/bin/python 01_embeddings/experiment_chunk_size.py \
            | tee .artifacts/retrieval_report.txt

      - name: Regression gate
        # ACTUALLY RUN THE GATE. The earlier version only inlined
        # .artifacts/regression_report.md "if it exists" -- and a unit test was
        # leaving its fixture data there, so a PR comment once reported
        # "faithfulness improved 0.900 -> 1.000" on a run that computed no
        # faithfulness at all. Publishing a file you did not produce is how a
        # test artifact becomes a measurement.
        #
        # --deterministic keeps this on retrieval metrics, which need no model.
        # Exit 1 (regression) fails the job; exit 2 (invalid run) also fails,
        # and the two are distinguishable in the log.
        run: .venv/bin/python scripts/run_regression_gate.py --deterministic

      - name: Build the PR comment body
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### Evaluation gate"
            echo
            echo "Fast tier passed (no model required)."
            echo
            echo "<details><summary>Retrieval quality across chunk sizes</summary>"
            echo
            echo '```'
            cat .artifacts/retrieval_report.txt
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>Regression gate</summary>"
            echo
            # Produced by the step above in THIS run. Never "whatever file
            # happens to be here" -- see the Regression gate step.
            cat .artifacts/regression_report.md
            echo
            echo "</details>"
          } > .artifacts/pr_comment.md

      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.artifacts/pr_comment.md', 'utf8');
            const marker = '### Evaluation gate';

            // Update the existing comment rather than adding one per push.
            // A PR with 20 near-identical bot comments is unreadable, and
            // reviewers stop looking at any of them.
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload artifacts
        if: always()   # upload on failure too -- that is when you need them
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: .artifacts/
          retention-days: 14
